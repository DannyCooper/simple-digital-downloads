name: Deploy to WordPress.org

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release tag matches plugin version
        run: |
          VERSION=$(grep -m1 -E '^ \* Version:' simple-digital-downloads.php | awk '{print $NF}')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag ($TAG) does not match plugin version ($VERSION)."
            exit 1
          fi

      # Git Updater headers are for GitHub installs only; WordPress.org
      # plugins must update from WordPress.org.
      - name: Strip Git Updater headers
        run: |
          sed -i '/^ \* GitHub Plugin URI:/d; /^ \* Primary Branch:/d' simple-digital-downloads.php
          ! grep -qE 'GitHub Plugin URI|Primary Branch' simple-digital-downloads.php

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: simple-digital-downloads
